name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Portão único (fmt + clippy -D warnings + test + firewall + tamanho)
        run: make check
      - name: Métricas por função (feature instrument)
        run: cargo test -p ktu-core --features instrument
