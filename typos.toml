# typos (crate-ci/typos) — configuração do ktu.
#
# O projeto é escrito em português (comentários, docs e mensagens). O dicionário
# do `typos` é inglês, por isso aceitamos explicitamente o vocabulário português
# abaixo (mapeando cada palavra para si própria). Material de referência/gerado
# fica fora do âmbito; um erro novo continua a ser apanhado.

[files]
extend-exclude = ["REF/", "crates/knudge/", "wiki/", ".knudge/", ".agents/", "models/"]

[default.extend-words]
