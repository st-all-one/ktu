# Teto de superfície pública (H11) — a superfície do `ktu` não cresce em silêncio.
#
# A medida é `ktu self surface` (subcomandos + flags da árvore do `clap`, tools do
# catálogo builtin + as do loop). `make check` corre `xtask check-surface`: se a medida
# exceder o teto, o gate falha — subir o teto é uma alteração **explícita**, na mesma
# alteração que o justifica (ver `wiki/adr/0011-limite-de-400-linhas-e-firewall-mecanico.md`
# e `wiki/metodo-medicao.md`).
#
# Regra de poda (M1): subir o teto obriga a dizer **que consumidor** a superfície nova serve.
#
# Histórico das subidas:
# - 2026-10-18 (diagnóstico): subcomandos 50 → 51 — `ktu memory doctor` (o diagnóstico
#   da memória passa a ter porta própria na área da memória; o `--memory` do `doctor`
#   sai e o `ktu doctor` passa a diagnosticar o **projecto**). As flags não mudam
#   (entra o `--root` do `memory doctor`, sai o `--memory`). Consumidor: a memória é o
#   eixo que o utilizador precisa de diagnosticar (`ktu memory doctor`), e o `doctor`
#   prometia «layout e conhecimento» mas corria o diagnóstico do provider.
# - 2026-10-18 (F5): subcomandos 49 → 50 — `ktu config doctor` (o schema de cada
#   nível e se migraria, sem escrever), consumidor: F5 (L3 do dossiê: uma config
#   antiga não pode migrar em silêncio nem corromper; ver `wiki/pendencias.md` D2).
# - 2026-10-18 (F3): subcomandos 47 → 49 e flags 88 → 89 — `ktu skills ls` (+ o `--root`
#   das listagens), consumidor: M8 (o piso visível — as skills compõem o prompt e não
#   tinham `ls`; ver `wiki/implementation_phase3/F3-recursos-globais.md`).
# - 2026-10-18 (H12): flags 87 → 88 — `ktu run --script <ficheiro>` (guião do `--provider
#   scripted`), consumidor: os gates G10/G11 (ver `wiki/adr/0018-*.md`).

